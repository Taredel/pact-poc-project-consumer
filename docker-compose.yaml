# Pact Broker stack for Podman (`podman compose`) and Docker (`docker compose`).
# The fixed project name makes both repos start the same broker.
name: pact-broker

services:
  postgres:
    image: docker.io/library/postgres:16
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres" ]
      interval: 5s
      retries: 10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    volumes:
      - pact-broker-db:/var/lib/postgresql/data

  broker_app:
    image: docker.io/pactfoundation/pact-broker:3.0.0-pactbroker2.121.2
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9292:9292"
    environment:
      PACT_BROKER_BASIC_AUTH_USERNAME: pact_username
      PACT_BROKER_BASIC_AUTH_PASSWORD: pact_password
      PACT_BROKER_DATABASE_USERNAME: postgres
      PACT_BROKER_DATABASE_PASSWORD: password
      PACT_BROKER_DATABASE_HOST: postgres
      PACT_BROKER_DATABASE_NAME: postgres
      PACT_BROKER_ALLOW_DANGEROUS_CONTRACT_MODIFICATION: "true"
      PACT_BROKER_ORDER_DEPLOYMENTS_BY_CREATED_AT: "true"

  # Public tunnel to the broker; started only with `--profile public`.
  # NGROK_AUTHTOKEN and NGROK_DOMAIN come from .env (see .env.example).
  ngrok:
    image: docker.io/ngrok/ngrok:3.39.13-alpine
    profiles: [ "public" ]
    depends_on:
      - broker_app
    command: [ "http", "broker_app:9292", "--url=${NGROK_DOMAIN}" ]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"

volumes:
  pact-broker-db:
